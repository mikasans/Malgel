name: CI

on:
  push:
  pull_request:
  # Running CI by hand (Actions → CI → Run workflow) also builds on macOS.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig-dev libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev libssl-dev libzstd-dev libvulkan1 \
            fonts-noto-cjk
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      # A plain build, before the test one: the test and clippy targets pull
      # in gpui-kit's test-support dev-dependency, whose feature unification
      # brings back gpui-pre APIs (such as the scroll handle's own index) that
      # a release build does not have. Building without it here catches that
      # class of break on the fast runner instead of in a release.
      - run: cargo build --locked
      - run: cargo test --locked
      # The window itself, headless: Xvfb plus Mesa's software GL renderer.
      # Mesa's Vulkan present path needs DRI3, which Xvfb lacks, so the smoke
      # test renders through GL (see scripts/e2e/gui_smoke.sh).
      - name: Install GUI test dependencies
        run: |
          sudo apt-get install -y xvfb xdotool imagemagick libgl1-mesa-dri \
            libglx-mesa0 libegl1 libegl-mesa0 libgles2 libgbm1 fonts-dejavu-core \
            python3-pil xclip
      - run: scripts/e2e/gui_smoke.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: gui-smoke
          path: |
            target/e2e-artifacts/*.png
            target/e2e-artifacts/*.log
          if-no-files-found: ignore

  # The integrated terminal under load (scripts/e2e/terminal_stress.sh):
  # floods, Ctrl+C/D/Z, vim/less/top, split, resize, kill, shell exit. A job of
  # its own so it neither slows nor shares a cache with `check`. Shared
  # runners render in software and are noisier than a desktop, so the timing
  # limits are looser than the script's defaults; the functional checks
  # (signals delivered, programs exit, panes independent) are the same.
  terminal-stress:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig-dev libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev libssl-dev libzstd-dev libvulkan1 \
            xvfb xdotool imagemagick libgl1-mesa-dri libglx-mesa0 libegl1 libegl-mesa0 libgles2 libgbm1 \
            fonts-dejavu-core vim less procps python3
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # One cache for both release jobs: they build the same binary, so a
          # change to Cargo.lock or the release profile rebuilds it cold once,
          # not once per job.
          shared-key: linux-release
      - run: cargo build --release --locked
      - name: Terminal stress
        env:
          E2E_ARTIFACTS: ${{ github.workspace }}/target/e2e-terminal
          E2E_TIMEOUT: "1500"
          TERM_LAG_LIMIT_MS: "500"
          P2_CPU_LIMIT: "200"
          P2_LAG_LIMIT_MS: "400"
          P2_PROMPT_LIMIT_MS: "500"
          INT_SETTLE_LIMIT_MS: "400"
          KILL_LIMIT_MS: "500"
        run: scripts/e2e/terminal_stress.sh
      - name: Results
        if: always()
        run: |
          f=target/e2e-terminal/results.tsv
          [ -f "$f" ] && { echo '```' ; cat "$f"; echo '```'; } >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terminal-stress
          path: |
            target/e2e-terminal/results.tsv
            target/e2e-terminal/*.png
            target/e2e-terminal/*.log
          if-no-files-found: warn

  perf:
    # Performance regression gate: medians of three runs against
    # scripts/e2e/perf_thresholds.json (see scripts/e2e/README.md).
    name: perf gate (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system and GUI test libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig-dev libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev libssl-dev libzstd-dev libvulkan1 \
            fonts-noto-cjk xvfb xdotool imagemagick libgl1-mesa-dri libglx-mesa0 libegl1 libegl-mesa0 libgles2 libgbm1 \
            fonts-dejavu-core libxtst6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # One cache for both release jobs: they build the same binary, so a
          # change to Cargo.lock or the release profile rebuilds it cold once,
          # not once per job.
          shared-key: linux-release
      - run: cargo build --release --locked
      - run: scripts/e2e/perf_scenes.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-scenes
          path: target/e2e-artifacts/perf-scenes
          if-no-files-found: ignore

  windows:
    runs-on: windows-latest
    env:
      # aws-lc-sys (TLS for remote images) needs NASM on x86_64 Windows
      # unless it may use its prebuilt objects.
      AWS_LC_SYS_PREBUILT_NASM: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
      - run: cargo test --locked

  macos:
    # Only when CI is run by hand, as macOS runners are billed by the
    # minute. The repository variable MACOS_RUNNER picks another macOS
    # runner, such as GetMac's; GitHub's macOS 26 runner otherwise.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-26' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
      - run: cargo test --locked
