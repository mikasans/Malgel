name: CI

on:
  push:
  pull_request:
  # Running CI by hand (Actions → CI → Run workflow) also builds on macOS.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig-dev libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev libssl-dev libzstd-dev libvulkan1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      # A plain build, before the test one: the test and clippy targets pull
      # in gpui-kit's test-support dev-dependency, whose feature unification
      # brings back gpui-pre APIs (such as the scroll handle's own index) that
      # a release build does not have. Building without it here catches that
      # class of break on the fast runner instead of in a release.
      - run: cargo build --locked
      - run: cargo test --locked
      # The window itself, headless: Xvfb plus Mesa's software GL renderer.
      # Mesa's Vulkan present path needs DRI3, which Xvfb lacks, so the smoke
      # test renders through GL (see scripts/e2e/gui_smoke.sh).
      - name: Install GUI test dependencies
        run: |
          sudo apt-get install -y xvfb xdotool imagemagick libgl1-mesa-dri \
            libglx-mesa0 libegl1 libegl-mesa0 libgles2 libgbm1 fonts-dejavu-core \
            python3-pil xclip
      - run: scripts/e2e/gui_smoke.sh

  windows:
    runs-on: windows-latest
    env:
      # aws-lc-sys (TLS for remote images) needs NASM on x86_64 Windows
      # unless it may use its prebuilt objects.
      AWS_LC_SYS_PREBUILT_NASM: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
      - run: cargo test --locked

  macos:
    # Only when CI is run by hand, as macOS runners are billed by the
    # minute. The repository variable MACOS_RUNNER picks another macOS
    # runner, such as GetMac's; GitHub's macOS 26 runner otherwise.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-26' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
      - run: cargo test --locked
