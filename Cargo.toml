[package]
name = "malgel"
version = "0.1.32"
edition = "2024"
description = "Malgel — a fast, native Markdown editor and previewer built with GPUI Kit."
license = "Apache-2.0"
repository = "https://github.com/rcawston/Malgel"
homepage = "https://www.malgel.com"
publish = false

[dependencies]
# Force rust-embed to embed at compile time even with debug-assertions on
# (dev builds, and cross-builds that ask for them, would otherwise make
# gpui-kit assets load from the build machine at runtime).
rust-embed = { version = "8.12.0", features = ["debug-embed"] }

log = "0.4"
# GPUI Kit is the only UI dependency: it re-exports GPUI, GPUI Base and GPUI Component.
gpui-kit = { version = "0.7.0", features = [
    "tree-sitter",
    "tree-sitter-markdown",
    "tree-sitter-markdown-inline",
    "tree-sitter-rust",
    "tree-sitter-python",
    "tree-sitter-javascript",
    "tree-sitter-typescript",
    "tree-sitter-tsx",
    "tree-sitter-bash",
    "tree-sitter-go",
    "tree-sitter-c",
    "tree-sitter-cpp",
    "tree-sitter-html",
    "tree-sitter-css",
    "tree-sitter-toml",
    "tree-sitter-yaml",
    "tree-sitter-java",
    "tree-sitter-ruby",
    "tree-sitter-diff",
    "tree-sitter-swift",
    "tree-sitter-kotlin",
    "tree-sitter-zig",
    "tree-sitter-lua",
    "tree-sitter-csharp",
    "tree-sitter-php",
    "tree-sitter-scala",
    "tree-sitter-elixir",
    "tree-sitter-graphql",
    "tree-sitter-make",
    "tree-sitter-cmake",
    "tree-sitter-proto",
] }
# Loads remote (http/https) images referenced by documents, e.g. README badges.
reqwest_client = { package = "gpui-pre-reqwest-client", version = "=0.3.7" }
# Same Markdown parser the preview uses; drives HTML export and scroll-sync block indexing.
markdown = "1.0.0"
serde = { version = "1", features = ["derive"] }
# Display width of table cells, so wide characters line up.
unicode-width = "0.2"
# Mermaid diagrams, parsed, laid out and drawn in pure Rust.
merman = { version = "=0.8.0-alpha.6", default-features = false, features = ["svg", "layout-cytoscape"] }
# Spell checking with Hunspell dictionaries, in pure Rust.
spellbook = "0.4"
# Word boundaries for spell checking.
unicode-segmentation = "1"
# "Copy as rich text": GPUI's clipboard only carries plain text and images.
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }
base64 = "0.22"
# Files the system asks Malgel to open arrive on another thread.
futures = "0.3"
url = "2"
# The SVG renderer GPUI draws with: the diagram viewer draws the part of a
# zoomed diagram in view with it, so it stays sharp.
resvg = { version = "0.46", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
# System fonts give exported PDFs coverage the bundled fonts lack (CJK, emoji).
fontdb = "0.23"
# Picks A4 or US Letter for exports from the system locale.
sys-locale = "0.3"
# The platform's data and cache folders. The Typst preview reads packages from
# the folders the `typst` command keeps them in, which are these two; already
# in the lockfile, since shellexpand pulls the same crate in.
dirs = "6"
# Word export. `image` converts pictures to PNG and `zip` finishes the
# package; docx-rs already builds both.
docx-rs = "0.4.22"
# Size probing for the image viewer: the decoders the viewer names in
# `image_format` must be compiled in, or an image's natural size silently
# falls back to the 4:3 default frame.
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "webp",
    "bmp",
    "tiff",
    "ico",
] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
# Quick Open walks the open folder with this: it reads .gitignore, .ignore and
# the global git ignore, so the palette does not offer build output or a
# vendored tree. Typst already pulls it in, so the lockfile does not move.
ignore = "0.4.33"
# Integrated terminal (Ctrl+`): a real shell in a bottom panel via a PTY.
portable-pty = "0.9"
# Math rendering, all pure Rust: LaTeX is translated to Typst math, laid out
# by the Typst compiler with its bundled math fonts, and drawn as SVG (or PNG
# for Word). PDF export compiles whole documents with the same compiler.
# LaTeX math → Typst math (Apache-2.0), without its command-line tool.
tylax = { version = "0.3.8", default-features = false }
typst = "0.15.1"
typst-assets = { version = "0.15.1", features = ["fonts"] }
comemo = "0.5"
typst-layout = "0.15.1"
typst-pdf = "0.15.1"
typst-render = "0.15.1"
typst-svg = "0.15.1"
serde_json = "1"
# Native PDF viewing support
hayro = "0.7.1"
hayro-svg = "0.7.0"
typst-ide = "0.15.1"

# "Default app for Markdown" in Settings.
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-foundation-sys = "0.8"

[target.'cfg(windows)'.dependencies]
windows-registry = "0.6"
windows-sys = { version = "0.61", features = ["Win32_UI_Shell"] }

[build-dependencies]
# Windows only (build.rs checks the target): the exe's icon and version info.
winresource = { version = "0.1.31", default-features = false }

[dev-dependencies]
gpui-kit = { version = "0.7.0", features = ["test-support"] }

# Dependencies are large (GPUI, tree-sitter grammars, Typst); full debug info
# for them makes every test binary hundreds of megabytes.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Keep debug-assertions off here: gpui-pre-windows only compiles its shaders
# at build time (fxc) in a release without them, and with them on it reads the
# HLSL from CARGO_MANIFEST_DIR at runtime — a build-machine path, so the exe
# dies in DirectWrite init on every other machine. A Linux cross-build has no
# fxc and needs the runtime path: add
# `--config profile.release.debug-assertions=true` to that cargo invocation
# only, and treat the result as unshippable.
[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = true

# gpui-base 0.7.0: fold chevrons only armed their click handlers when painted
# (hover / current line / folded), and EditorState exposed no Fold / Unfold API.
# This patch (fork of longbridge/gpui-kit @ v0.7.0) arms chevron hits every
# frame, widens the fold column (~24px hitbox), and adds toggle_fold / fold_at
# / unfold_line_at. Remove when upstream ships the same.
[patch.crates-io]
gpui-base = { git = "https://github.com/mikasans/gpui-kit", branch = "malgel-fold-0.7.0" }
